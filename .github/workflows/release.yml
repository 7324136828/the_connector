name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Build and publish one release at a time without canceling queued builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Choose release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Format UTC build time
        id: version
        run: echo "version=$(date -u +'%Y.%m.%d%H%M')" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows binaries (${{ matrix.device }})
    needs: version
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, cuda]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KOKORO_DEVICE: ${{ matrix.device }}
      BUILD_DIRECTORY: ${{ github.workspace }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # CUDA wheels, freezer output, and both packages need substantial space.
      # These preinstalled IDEs are unused by the Python/Node build.
      - name: Free disk space for CUDA packaging
        if: matrix.device == 'cuda'
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Disk cleanup is only allowed on an ephemeral GitHub-hosted runner.'
          }
          foreach ($directory in @(
            'C:\Program Files\Microsoft Visual Studio',
            'C:\Program Files (x86)\Microsoft Visual Studio'
          )) {
            if (Test-Path -LiteralPath $directory) {
              $resolved = (Resolve-Path -LiteralPath $directory).Path
              if ($resolved -ne $directory) { throw "Unexpected cleanup path: $resolved" }
              Remove-Item -LiteralPath $resolved -Recurse -Force -ErrorAction Stop
            }
          }
          # The checkout can be on D:, so build CUDA on the C: drive we freed.
          $buildDirectory = Join-Path 'C:\' "connector-build-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $buildDirectory) { throw "Build directory already exists: $buildDirectory" }
          New-Item -ItemType Directory -Path $buildDirectory | Out-Null
          foreach ($entry in (Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force)) {
            if ($entry.Name -ne '.git') {
              Copy-Item -LiteralPath $entry.FullName -Destination $buildDirectory -Recurse -Force
            }
          }
          "BUILD_DIRECTORY=$buildDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-PSDrive C | Select-Object Used, Free

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure download cache directories
        run: |
          # Keep cache paths independent of CUDA's run-specific build directory.
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'connector-cache'
          @(
            "PIP_CACHE_DIR=$cacheRoot\pip-$env:KOKORO_DEVICE"
            "NPM_CONFIG_CACHE=$cacheRoot\npm"
            "HF_HUB_CACHE=$cacheRoot\huggingface"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Reuse downloads while still installing dependencies and rebuilding.
      - name: Cache Python package downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-windows2022-pip-py312-${{ matrix.device }}-v1-${{ hashFiles('build.py', 'backend/requirements*.txt', 'python-kokoro/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-windows2022-pip-py312-${{ matrix.device }}-v1-

      - name: Cache npm package downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-npm-node22-v1-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-node22-v1-

      - name: Cache Kokoro model downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: ${{ runner.os }}-kokoro-assets-v1-${{ hashFiles('python-kokoro/model_assets.py', 'python-kokoro/prepare_assets.py') }}

      # Both variants run frontend tests and offline speech smoke tests.
      # CUDA is tested on CPU here; its delivered runtime profile remains CUDA.
      - name: Build and smoke-test portable packages
        working-directory: ${{ env.BUILD_DIRECTORY }}
        run: |
          if ($env:KOKORO_DEVICE -eq 'cuda') {
            python -u build.py --kokoro-device cuda --cuda-smoke-device cpu
          } else {
            python -u build.py --kokoro-device cpu
          }

      - name: Test backend
        working-directory: ${{ env.BUILD_DIRECTORY }}
        run: .\.venv\Scripts\python.exe -m pytest backend/tests -q

      - name: Test speech service
        working-directory: ${{ env.BUILD_DIRECTORY }}
        run: |
          & ".\build\kokoro-venv-$env:KOKORO_DEVICE\Scripts\python.exe" -m unittest discover -s python-kokoro -p test_server.py -q

      - name: Archive portable packages
        working-directory: ${{ env.BUILD_DIRECTORY }}
        run: python release_assets.py --version $env:VERSION --device $env:KOKORO_DEVICE

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries-${{ needs.version.outputs.version }}-${{ matrix.device }}
          path: ${{ env.BUILD_DIRECTORY }}/dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: windows-binaries-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Publish versioned binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > release-notes.md <<'EOF'
          Choose CPU packages for machines without CUDA, or CUDA packages for a compatible NVIDIA GPU and driver. Debug binds locally; Release allows LAN access.

          Extract the complete package and start run.bat inside Debug or Release. If an archive has numbered .zip.001, .zip.002 parts, download all parts into the same folder and extract .zip.001 with 7-Zip.

          CUDA packages are smoke-tested on CPU in CI. GPU execution is checked when the CUDA package starts on your machine.
          EOF
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "The Connector $VERSION" \
            --notes-file release-notes.md \
            --generate-notes
